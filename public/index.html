<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Court · 에이전트 조정</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22><text y=%2214%22 font-size=%2214%22>🏯</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Song+Myung&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="seal">實錄</span>
      <div>
        <div class="title">Agent Court · 에이전트 조정</div>
        <div class="subtitle" id="subtitle">전하의 조정이 돌아가고 있사옵니다</div>
      </div>
    </div>
    <div class="top-right">
      <span id="conn" class="chip off">연결 중…</span>
      <div class="clock px-wood"><span id="sijin" class="sijin">-</span><span id="clock">--:--:--</span></div>
      <button id="nightBtn" class="btn" title="밤낮 보기 전환">🌗 시각대로</button>
      <button id="soundBtn" class="btn" title="소리">🔊 소리</button>
      <button id="notifyBtn" class="btn">🔔 알림</button>
    </div>
  </header>

  <main class="layout">
    <aside class="panel left">
      <section class="px-panel box">
        <h2 class="ribbon">오늘의 조정</h2>
        <div id="stats" class="stats"></div>
      </section>
      <section class="px-panel box grow">
        <nav class="tabs" id="tabs">
          <button data-tab="feed" class="on">사초</button>
          <button data-tab="convo">서찰 <b class="badge-n" id="nConvo"></b></button>
          <button data-tab="media">진상 <b class="badge-n" id="nMedia"></b></button>
        </nav>
        <div class="tab-body" id="tabFeed"><ol id="feed" class="feed"></ol></div>
        <div class="tab-body" id="tabConvo" hidden><div id="convo" class="convo"></div></div>
        <div class="tab-body" id="tabMedia" hidden><div id="media" class="media-grid"></div></div>
      </section>
    </aside>

    <section class="stage">
      <div id="alerts" class="alerts"></div>
      <div class="canvas-wrap" id="canvasWrap">
        <div class="map-frame"><canvas id="map"></canvas></div>
        <div id="tooltip" class="tooltip" hidden></div>
        <div id="toasts" class="toasts"></div>
        <div class="map-ctl"><button class="btn" id="zIn" title="당겨 보기">＋</button><button class="btn" id="zOut" title="물려 보기">－</button><button class="btn" id="zAll" title="동궐 전체">전경</button></div>
      </div>
      <p class="hint">끌어서 옮기고 휠로 당겨 보시옵소서 · 인물·관청·전하를 누르면 자세히 · 풍경·인물: OpenAI</p>
    </section>

    <aside class="panel right">
      <section class="px-panel box grow" id="side"></section>
    </aside>
  </main>

  <footer class="footer" id="bars"></footer>

  <div id="viewer" class="viewer" hidden>
    <div class="viewer-card px-wood">
      <div class="viewer-head">
        <div><b id="vTitle"></b> <span class="muted" id="vMeta"></span></div>
        <div class="viewer-actions">
          <button class="btn" id="vPrev">◀</button><span id="vIdx" class="muted"></span><button class="btn" id="vNext">▶</button>
          <a class="btn" id="vOpen" target="_blank" rel="noopener">새 창</a>
          <button class="btn btn-red" id="vClose">✕</button>
        </div>
      </div>
      <div class="viewer-note" id="vNote"></div>
      <div class="viewer-body" id="vBody"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
